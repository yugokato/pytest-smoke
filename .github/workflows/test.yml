name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.has-changes }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            has-changes:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'uv.lock'
              - 'tox.ini'
              - '.github/workflows/test.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --group lint
      - name: Run pre-commit
        shell: bash
        run: |
          uv run --no-sync pre-commit run --all-files --show-diff-on-failure

  package:
    needs: [changes, lint]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and Check Package
        uses: hynek/build-and-inspect-python-package@v2

  test:
    needs: [package]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.has-changes == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest", "windows-latest"]
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            tox.ini
      - name: Install tox
        run: uv sync --locked --only-group tox
      - name: Test
        shell: bash
        run: |
          uv run --no-sync tox -e py,xdist --installpkg `find dist/*.tar.gz`

  status-check:
    if: always()
    needs: [lint, package, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Status check failed for one or more jobs"
          exit 1
